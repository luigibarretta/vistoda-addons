configuration:
  alias:
    name: Alias telecamera
    description: Nome breve e stabile usato per le entità Home Assistant, ad esempio ingresso.
  camera_serial:
    name: Seriale telecamera EZVIZ
    description: Obbligatorio prima dell'avvio. Inserisci lettere e numeri dalle informazioni dispositivo EZVIZ, non il codice di verifica.
  camera_channel:
    name: Canale telecamera o NVR
    description: Usa 1 per una telecamera autonoma. Per un NVR inserisci il canale esatto indicato nelle informazioni dispositivo EZVIZ.
  substream:
    name: Preferisci stream a banda ridotta
    description: Usa lo stream secondario se disponibile. Utile su connessioni lente; lascia disattivato per la qualità migliore.
  verification_code:
    name: Codice di verifica del dispositivo (facoltativo)
    description: Il codice di 6 lettere sull'etichetta della telecamera. Serve solo se la diretta di una telecamera criptata non funziona; di norma Vistoda lo legge dall'account EZVIZ. Resta privato.
  cameras:
    name: Più telecamere
    description: Lista facoltativa di 1–64 telecamere. Se compilata sostituisce alias, seriale, canale e stream singoli.
  alarm_history_limit:
    name: Eventi conservati per telecamera
    description: "Quanti eventi tenere per ogni telecamera (50–2000). Eventi e immagini stanno sul disco di Home Assistant e finiscono nei suoi backup. Per uno storico lungo usa l'archivio eventi di Vistoda su un'unità di rete, oppure SceneTrove. Se abbassi il valore, gli eventi più vecchi vengono eliminati al prossimo avvio."
  alarm_picture_budget_mib:
    name: Spazio massimo per le immagini (MiB)
    description: "Spazio totale per le immagini degli eventi di tutte le telecamere (64–2048 MiB), diviso in parti uguali. Quando è pieno vengono eliminate le immagini più vecchie; gli eventi restano, senza immagine. Conta anche nella dimensione dei backup di Home Assistant."
network:
  8765/tcp: API privata di Vistoda EZVIZ
