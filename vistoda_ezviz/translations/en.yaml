configuration:
  alias:
    name: Camera alias
    description: Short stable name used for Home Assistant entities, such as front-door.
  camera_serial:
    name: EZVIZ camera serial
    description: Required before starting. Enter the letters and digits in EZVIZ device information, not the verification code.
  camera_channel:
    name: Camera or NVR channel
    description: Use 1 for a standalone camera. For an NVR, enter the exact camera channel from EZVIZ device information.
  substream:
    name: Prefer lower-bandwidth stream
    description: Uses the secondary stream when the camera exposes it. Useful on slower links; leave disabled for best quality.
  verification_code:
    name: Device verification code (optional)
    description: The 6-letter code on the camera label. Only needed if live view of an encrypted camera fails; normally Vistoda reads it from your EZVIZ account. Kept private.
  cameras:
    name: Multiple cameras
    description: Optional list of 1–64 cameras. When populated, it replaces the single alias, serial, channel and stream fields.
  alarm_history_limit:
    name: Events kept per camera
    description: "How many events to keep for each camera (50–2000). Events and pictures are stored on Home Assistant's own disk and included in its backups. For a long history use the Vistoda event archive on network storage, or SceneTrove. Lowering the value deletes the oldest events at the next start."
  alarm_picture_budget_mib:
    name: Maximum picture storage (MiB)
    description: "Total space for event pictures of all cameras (64–2048 MiB), split evenly. When full, the oldest pictures are deleted; the events stay, without a picture. It also counts towards the size of Home Assistant backups."
network:
  8765/tcp: Private Vistoda EZVIZ API
