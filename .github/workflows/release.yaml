name: release-catalog

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable catalog tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify catalog tag and contracts
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          release_tag="${DISPATCH_TAG:-${GITHUB_REF_NAME}}"
          test "${release_tag}" = "v$(tr -d '[:space:]' < VERSION)"
          python scripts/check.py
          python scripts/publish-release.py --tag "${release_tag}" --dry-run
      - name: Publish immutable catalog metadata
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          release_tag="${DISPATCH_TAG:-${GITHUB_REF_NAME}}"
          python scripts/publish-release.py --tag "${release_tag}"
