name: Vistoda EZVIZ
version: 0.7.1
slug: vistoda_ezviz
description: EZVIZ snapshots, live media and standalone recordings
url: https://github.com/luigibarretta/vistoda-ezviz
arch:
  - amd64
  - aarch64
startup: services
init: false
hassio_api: true
discovery:
  - media_bridge
ports:
  8765/tcp: null
ports_description:
  8765/tcp: Private Vistoda EZVIZ API
options:
  alias: front-door
  camera_serial: ""
  camera_channel: 1
  substream: false
  cameras: []
schema:
  alias: match(^[A-Za-z0-9_-]+$)
  camera_serial: match(^[A-Za-z0-9]*$)
  camera_channel: int(1,256)
  substream: bool
  cameras:
    - alias: match(^[A-Za-z0-9_-]{1,64}$)
      serial: match(^[A-Za-z0-9]+$)
      channel: int(1,256)
      substream: bool
image: ghcr.io/luigibarretta/vistoda-ezviz-addon
