name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Mirrors .github/workflows/validate.yaml so the Gitea source of truth enforces
# the same gates before the GitHub mirror and catalog release run.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pip==26.2.2
      - run: python -m pip install pytest==9.1.1
      - run: python scripts/check.py
      - run: python -m pytest -q
      - run: python scripts/verify-app-sources.py

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The script pins the Gitleaks release and verifies its SHA-256 before
      # running, without depending on the GitHub-only gitleaks action.
      - name: Scan complete Git history with pinned Gitleaks
        run: scripts/run-gitleaks.sh

  app-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Runs the checksummed upstream linter in a local venv; no Docker needed.
      - name: Run pinned Home Assistant add-on linter
        run: scripts/run-addon-linter.sh
