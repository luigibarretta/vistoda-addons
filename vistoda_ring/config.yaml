name: Vistoda Ring
version: 0.11.1
slug: vistoda_ring
description: Ring Intercom native calls, controls, full-duplex audio and local recordings
url: https://github.com/luigibarretta/vistoda-ring
arch:
  - amd64
  - aarch64
startup: services
init: false
hassio_api: true
discovery:
  - media_bridge
map:
  - type: addon_config
    read_only: false
  - type: media
    read_only: false
  - type: share
    read_only: false
ports:
  8775/tcp: null
ports_description:
  8775/tcp: Private Vistoda Ring API
options:
  alias: entrance
  recording_storage: private
schema:
  alias: match(^[A-Za-z0-9_-]+$)
  recording_storage: list(private|addon_config|media|share|network)
  recording_network_mount: str?
image: ghcr.io/luigibarretta/vistoda-ring-addon
