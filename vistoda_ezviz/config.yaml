name: Vistoda EZVIZ
version: 0.3.2
slug: vistoda_ezviz
description: EZVIZ VTM/VTDU snapshots, live media and bounded recordings
url: https://github.com/luigibarretta/vistoda-ezviz
arch:
  - amd64
  - aarch64
startup: services
init: false
hassio_api: true
