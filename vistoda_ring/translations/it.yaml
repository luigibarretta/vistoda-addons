configuration:
  alias:
    name: Alias dispositivo
    description: Alias iniziale o preferito avanzato; i citofoni autenticati sono scoperti automaticamente.
  intercoms:
    name: Citofoni
    description: >-
      Lascia vuoto per la discovery automatica dopo il login Ring, anche con più
      ingressi. Solo avanzato: imposta alias personalizzati con device_id numerici
      Ring distinti e verificati. Non usare ID di posizione o inventati.
  recording_storage:
    name: Archivio registrazioni
    description: >-
      Scegli private per /data/recordings (privato e incluso nei backup dell'app);
      addon_config per /addon_configs/10aad50a_vistoda_ring/recordings; media per
      /media/vistoda-ring; share per /share/vistoda-ring. Media e share sono locali:
      non diventano NFS/Samba da soli. Scegli network per un archivio di rete montato
      da Home Assistant OS. I file esistenti vengono migrati con verifica.
  recording_network_mount:
    name: Percorso network storage HAOS
    description: >-
      Usato solo con network. Prima aggiungi una condivisione NFS o Samba da
      Impostazioni > Sistema > Archiviazione, con utilizzo Media o Share; inserisci
      qui il mount risultante, ad esempio /media/ring-archive oppure
      /share/ring-archive. Vistoda salva nella sottocartella vistoda-ring e rifiuta
      percorsi locali o mount non disponibili.
network:
  8775/tcp: API privata di Vistoda Ring
