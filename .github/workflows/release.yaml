name: release-catalog

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/validate.yaml

  release:
    needs: validation
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify exact catalog source and public signed images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)"
          python scripts/check.py
          python scripts/publish-release.py --tag "${GITHUB_REF_NAME}" --dry-run
          python scripts/verify-images.py > release-evidence.json
      - name: Publish immutable catalog metadata and verified digest evidence
        env:
          FORGE_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/publish-release.py --tag "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" release-evidence.json
